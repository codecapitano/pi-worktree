name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Validate package
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "@codecapitano/pi-worktree") process.exit(1); if (p.private !== true) process.exit(1); if (!p.pi?.extensions?.length) process.exit(1); if (!p.files?.includes("lib") || !p.files?.includes("LICENSE") || !p.files?.includes("NOTICE.md")) process.exit(1); console.log("ok", p.name, p.version)'
          npm pack --dry-run
