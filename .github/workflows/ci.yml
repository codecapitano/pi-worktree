name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Validate package
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "@codecapitano/pi-worktree") process.exit(1); if (p.private !== true) process.exit(1); if (!p.pi?.extensions?.length) process.exit(1); if (!p.files?.includes("LICENSE") || !p.files?.includes("NOTICE.md")) process.exit(1); console.log("ok", p.name, p.version)'
          npm pack --dry-run
